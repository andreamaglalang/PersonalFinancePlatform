android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.workers.max=1

# Preserve installed application and local data after connected tests.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Never uninstall a user installation to work around a signing/package mismatch.
android.experimental.testOptions.uninstallIncompatibleApks=false
