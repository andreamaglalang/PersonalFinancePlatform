name: Handoff offline verification
on:
  push:
    branches: ['handoff/**', 'dev']
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build PersonalFinancePlatform.slnx
      - shell: pwsh
        run: ./tools/Test-Handoff.ps1
  sql:
    # Real SQL Server checks in a throwaway service container; the harness creates and drops
    # its own PersonalFinanceSqlTests_* catalog. The password exists only for this job's container.
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: OwliCi_${{ github.run_id }}_Aa
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P OwliCi_${{ github.run_id }}_Aa -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/PersonalFinance.SqlIntegrationTests
        env:
          OWLI_SQL_TEST_SERVER: Server=localhost,1433;Database=master;User ID=sa;Password=OwliCi_${{ github.run_id }}_Aa;Encrypt=True;TrustServerCertificate=True
      - run: dotnet run --project tests/PersonalFinance.HangfireTests
        env:
          OWLI_SQL_TEST_SERVER: Server=localhost,1433;Database=master;User ID=sa;Password=OwliCi_${{ github.run_id }}_Aa;Encrypt=True;TrustServerCertificate=True
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - working-directory: android
        run: bash gradlew assembleDebug testDebugUnitTest testReleaseUnitTest lintDebug lintRelease compileDebugAndroidTestKotlin --no-daemon
