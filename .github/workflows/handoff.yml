name: Handoff offline verification
on:
  push:
    branches: ['handoff/**']
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build PersonalFinancePlatform.slnx
      - shell: pwsh
        run: ./tools/Test-Handoff.ps1
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - working-directory: android
        run: bash gradlew assembleDebug testDebugUnitTest testReleaseUnitTest --no-daemon
